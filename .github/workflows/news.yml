name: daily-news

on:
  schedule:
    # cron 使用 UTC 时间；30 0 UTC = 北京时间 08:30（晨报）
    - cron: "30 0 * * *"
    # 30 13 UTC = 北京时间 21:30（晚间版）
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取新闻并生成日报
        run: python fetch_news.py

      - name: 构建站点（含历史归档）
        run: python build_site.py --out site

      - name: 回写 reports 到仓库（保留历史）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "无新增报告，跳过提交"
          else
            git commit -m "日报更新 $(TZ=Asia/Shanghai date +%F-%H%M)"
            git push
          fi

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
